name: Build & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    concurrency:
      group: build-master
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1

      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-tcs-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Check for new data files
        id: check-data
        run: |
          before="${{ github.event.before }}"
          # First push reports an all-zero "before" SHA, and force-pushes can name a
          # commit we don't have locally (fetch-depth: 2 keeps only HEAD + its parent).
          # In either case fall back to HEAD~1; if even that is missing, regenerate.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            before="$(git rev-parse --verify --quiet HEAD~1 || true)"
          fi
          if [ -z "$before" ]; then
            echo "has_new_data=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$before" "${{ github.sha }}" -- 'static/api/*/20*.json' 'content/' | grep -q .; then
            echo "has_new_data=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install tcs
        if: steps.check-data.outputs.has_new_data || github.event_name == 'workflow_dispatch'
        run: pip install 'tcs @ git+https://${{ secrets.GH_ACCESS_TOKEN }}@github.com/monkatv/tcs.git'

      - name: Validate JSON files
        run: |
          python3 << 'PYTHON_EOF'
          import json
          from pathlib import Path
          api_dir = Path('static/api')
          bad_files = []
          for json_file in api_dir.glob('**/*.json'):
            try:
              with open(json_file, 'r') as f:
                json.load(f)
            except (json.JSONDecodeError, OSError) as e:
              bad_files.append(f"{json_file}: {e}")
          if bad_files:
            print("Invalid JSON files found:")
            for msg in bad_files:
              print(f"  {msg}")
            exit(1)
          print(f"✓ All JSON files valid ({len(list(api_dir.glob('**/*.json')))} files)")
          PYTHON_EOF

      - name: Generate summary JSONs
        if: steps.check-data.outputs.has_new_data || github.event_name == 'workflow_dispatch'
        run: tcs summarize --dir static/api

      - name: Commit updated summaries to master
        if: github.ref == 'refs/heads/master' && (steps.check-data.outputs.has_new_data || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/api/*/summary.json static/api/*/latest.json content/*/latest.md
          if ! git diff --cached --quiet; then
            git commit -m "Update streamer summaries"
            git pull --rebase
            git push
          fi

      - run: zola build

      - name: Smoke test build output
        run: |
          python3 << 'PYTHON_EOF'
          import json
          import toml
          from pathlib import Path

          # Check main index exists
          assert Path('public/index.html').exists(), "public/index.html missing"

          # Read streamers from data/streamers.toml
          with open('data/streamers.toml', 'r') as f:
            streamers_config = toml.load(f)
          streamers = list(streamers_config.get('streamers', {}).keys())

          # Check each streamer has an index page
          missing_streamers = []
          for streamer in streamers:
            streamer_index = Path(f'public/{streamer}/index.html')
            if not streamer_index.exists():
              missing_streamers.append(streamer)

          if missing_streamers:
            print(f"Missing index pages for: {', '.join(missing_streamers)}")
            exit(1)

          # Check main index contains all streamer logins
          with open('public/index.html', 'r') as f:
            index_html = f.read()

          missing_in_index = []
          for streamer in streamers:
            if streamer not in index_html:
              missing_in_index.append(streamer)

          if missing_in_index:
            print(f"Streamer logins missing from public/index.html: {', '.join(missing_in_index)}")
            exit(1)

          # Check one built API summary.json is valid
          if streamers:
            summary_path = Path(f'public/api/{streamers[0]}/summary.json')
            if summary_path.exists():
              try:
                with open(summary_path, 'r') as f:
                  json.load(f)
              except json.JSONDecodeError as e:
                print(f"Invalid JSON in {summary_path}: {e}")
                exit(1)

          print(f"✓ Smoke tests passed ({len(streamers)} streamers, all index pages exist)")
          PYTHON_EOF

      - name: Upload pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
