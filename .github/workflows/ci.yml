name: Build & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    concurrency:
      group: build-master
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1

      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-tcs-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Check for new data files
        id: check-data
        run: |
          before="${{ github.event.before }}"
          # First push reports an all-zero "before" SHA, and force-pushes can name a
          # commit we don't have locally (fetch-depth: 2 keeps only HEAD + its parent).
          # In either case fall back to HEAD~1; if even that is missing, regenerate.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            before="$(git rev-parse --verify --quiet HEAD~1 || true)"
          fi
          if [ -z "$before" ]; then
            echo "has_new_data=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$before" "${{ github.sha }}" -- 'static/api/*/20*.json' 'content/' | grep -q .; then
            echo "has_new_data=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install tcs
        if: steps.check-data.outputs.has_new_data || github.event_name == 'workflow_dispatch'
        run: pip install 'tcs @ git+https://${{ secrets.GH_ACCESS_TOKEN }}@github.com/monkatv/tcs.git'

      - name: Validate JSON files
        run: |
          python3 << 'PYTHON_EOF'
          import json
          import sys
          from pathlib import Path

          files = list(Path("static/api").glob("**/*.json"))
          bad = []
          for f in files:
              try:
                  json.loads(f.read_bytes())
              except (ValueError, OSError) as e:
                  bad.append(f"  {f}: {e}")
          if bad:
              sys.exit("Invalid JSON files found:\n" + "\n".join(bad))
          print(f"✓ All JSON files valid ({len(files)} files)")
          PYTHON_EOF

      - name: Generate summary JSONs
        if: steps.check-data.outputs.has_new_data || github.event_name == 'workflow_dispatch'
        run: tcs summarize --dir static/api

      - name: Commit updated summaries to master
        if: github.ref == 'refs/heads/master' && (steps.check-data.outputs.has_new_data || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/api/*/summary.json static/api/*/latest.json content/*/latest.md
          if ! git diff --cached --quiet; then
            git commit -m "Update streamer summaries"
            git pull --rebase
            git push
          fi

      - run: zola build

      - name: Smoke test build output
        run: |
          python3 << 'PYTHON_EOF'
          import json
          import sys
          import tomllib
          from pathlib import Path

          index = Path("public/index.html")
          if not index.exists():
              sys.exit("public/index.html missing")
          streamers = [s["login"] for s in tomllib.loads(Path("data/streamers.toml").read_text()).get("streamers", [])]
          missing = [s for s in streamers if not Path(f"public/{s}/index.html").exists()]
          if missing:
              sys.exit(f"Missing index pages for: {', '.join(missing)}")
          index_html = index.read_text()
          absent = [s for s in streamers if s not in index_html]
          if absent:
              sys.exit(f"Streamer logins missing from public/index.html: {', '.join(absent)}")
          if streamers:
              summary = Path(f"public/api/{streamers[0]}/summary.json")
              if summary.exists():
                  try:
                      json.loads(summary.read_text())
                  except json.JSONDecodeError as e:
                      sys.exit(f"Invalid JSON in {summary}: {e}")
          print(f"✓ Smoke tests passed ({len(streamers)} streamers, all index pages exist)")
          PYTHON_EOF

      - name: Upload pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
